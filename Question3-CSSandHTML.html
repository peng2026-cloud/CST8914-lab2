<!DOCTYPE html>
<html lang="en">

<head>
  <title>Question 3- CSS & HTML</title>
  <style>
    .button {
      background-color: #4CAF50;
      border: none;
      color: black; /* 7.56:1 on #4CAF50, was white at 2.78:1 */
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
    }

    .button:focus {
      outline: 3px solid white;
      outline-offset: 2px;
    }

    body {
      padding: 20px;
      background-color: #2f2f2f;
    }

    h1, h2, p {
      color: white; /* 13.39:1 on #2f2f2f, was black at 1.57:1 */
    }
  </style>
</head>

<body>
  
  <h1>HTML made Easy</h1>

  <p>What causes errors in HTML?</p>

  <button type="submit" class="button">Submit answers</button>

</body>

</html>
